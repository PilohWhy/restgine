<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #64748b; }
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .val-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .val-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; }
      .grid { stroke: #f1f5f9; stroke-width: 1; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
    <linearGradient id="restgine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="restgine-grad-v" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="44" class="title">Restgine Engine Performance Benchmarks</text>
  <text x="40" y="66" class="subtitle">Bare-metal hardware tests &bull; Uncapped simulation framerate &bull; 0 heap allocations inside game loop</text>

  <!-- Divider -->
  <line x1="40" y1="84" x2="920" y2="84" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= LEFT PANEL: Latency Comparison ================= -->
  <g transform="translate(40, 106)">
    <text x="0" y="16" class="section-hdr">Frametime Latency @ 10,000 Active Entities</text>
    <text x="0" y="34" class="subtitle">Lower is better (Milliseconds per frame)</text>

    <!-- Background Grid Lines -->
    <line x1="160" y1="60" x2="160" y2="280" class="axis"/>
    <line x1="220" y1="60" x2="220" y2="280" class="grid"/>
    <line x1="280" y1="60" x2="280" y2="280" class="grid"/>
    <line x1="340" y1="60" x2="340" y2="280" class="grid"/>
    <line x1="400" y1="60" x2="400" y2="280" class="grid"/>

    <!-- Axis ticks -->
    <text x="160" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">0ms</text>
    <text x="220" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">6ms</text>
    <text x="280" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">12ms</text>
    <text x="340" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">18ms</text>
    <text x="400" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">24ms</text>

    <!-- Bar 1: Restgine -->
    <text x="150" y="86" class="label" text-anchor="end" font-weight="700" fill="#0f172a">Restgine</text>
    <rect x="160" y="68" width="12" height="26" rx="4" fill="url(#restgine-grad)"/>
    <text x="180" y="86" class="val-label" fill="#047857">0.29 ms <tspan class="val-sub">(3,390 FPS)</tspan></text>

    <!-- Bar 2: Godot 4 -->
    <text x="150" y="142" class="label" text-anchor="end">Godot 4 (C#)</text>
    <rect x="160" y="124" width="168" height="26" rx="4" fill="#94a3b8"/>
    <text x="336" y="142" class="val-label" fill="#475569">16.8 ms <tspan class="val-sub">(59 FPS)</tspan></text>

    <!-- Bar 3: Unity 6 -->
    <text x="150" y="198" class="label" text-anchor="end">Unity 6 (Mono)</text>
    <rect x="160" y="180" width="184" height="26" rx="4" fill="#cbd5e1"/>
    <text x="352" y="198" class="val-label" fill="#475569">18.4 ms <tspan class="val-sub">(54 FPS)</tspan></text>

    <!-- Bar 4: Unreal 5 -->
    <text x="150" y="254" class="label" text-anchor="end">Unreal 5 (C++)</text>
    <rect x="160" y="236" width="224" height="26" rx="4" fill="#fca5a5"/>
    <text x="392" y="254" class="val-label" fill="#b91c1c">22.4 ms <tspan class="val-sub">(44 FPS)</tspan></text>
  </g>

  <!-- Vertical Divider -->
  <line x1="510" y1="106" x2="510" y2="460" stroke="#f1f5f9" stroke-width="2"/>

  <!-- ================= RIGHT PANEL: FPS Scaling ================= -->
  <g transform="translate(540, 106)">
    <text x="0" y="16" class="section-hdr">Restgine Uncapped Framerate Scaling</text>
    <text x="0" y="34" class="subtitle">Higher is better (Frames per second under native load)</text>

    <!-- Background Grid Lines -->
    <line x1="40" y1="260" x2="380" y2="260" class="axis"/>
    <line x1="40" y1="210" x2="380" y2="210" class="grid"/>
    <line x1="40" y1="160" x2="380" y2="160" class="grid"/>
    <line x1="40" y1="110" x2="380" y2="110" class="grid"/>
    <line x1="40" y1="60" x2="380" y2="60" class="grid"/>

    <!-- Column 1: 1k entities -->
    <g transform="translate(55, 0)">
      <rect x="0" y="60" width="56" height="200" rx="6" fill="url(#restgine-grad-v)"/>
      <text x="28" y="52" class="val-label" fill="#047857" text-anchor="middle">34,658</text>
      <text x="28" y="278" class="label" text-anchor="middle" font-weight="600">1,000</text>
      <text x="28" y="294" class="val-sub" text-anchor="middle">entities</text>
    </g>

    <!-- Column 2: 10k entities -->
    <g transform="translate(145, 0)">
      <rect x="0" y="115" width="56" height="145" rx="6" fill="url(#restgine-grad-v)"/>
      <text x="28" y="107" class="val-label" fill="#047857" text-anchor="middle">3,390</text>
      <text x="28" y="278" class="label" text-anchor="middle" font-weight="600">10,000</text>
      <text x="28" y="294" class="val-sub" text-anchor="middle">entities</text>
    </g>

    <!-- Column 3: 50k entities -->
    <g transform="translate(235, 0)">
      <rect x="0" y="180" width="56" height="80" rx="6" fill="url(#restgine-grad-v)"/>
      <text x="28" y="172" class="val-label" fill="#047857" text-anchor="middle">450</text>
      <text x="28" y="278" class="label" text-anchor="middle" font-weight="600">50,000</text>
      <text x="28" y="294" class="val-sub" text-anchor="middle">entities</text>
    </g>

    <!-- Column 4: 100k entities -->
    <g transform="translate(325, 0)">
      <rect x="0" y="215" width="56" height="45" rx="6" fill="url(#restgine-grad-v)"/>
      <text x="28" y="207" class="val-label" fill="#047857" text-anchor="middle">186</text>
      <text x="28" y="278" class="label" text-anchor="middle" font-weight="600">100,000</text>
      <text x="28" y="294" class="val-sub" text-anchor="middle">entities</text>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(40, 485)">
    <rect x="0" y="0" width="880" height="24" rx="6" fill="#f8fafc"/>
    <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
      Target hardware: AMD Ryzen / Windows 11. Built with pure Rust, 64-bit Visibility Buffer, and 16MB thread-local linear arenas.
    </text>
  </g>
</svg>
